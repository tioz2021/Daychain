<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Habits</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f8cff'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
      </span>
      <span data-i18n="app_name">Habits</span>
    </div>
    <nav class="nav" id="nav">
      <a href="#/today" data-view="today" title="Today">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15.5" r="1.6" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="nav_today">Today</span>
      </a>
      <a href="#/habits" data-view="habits" title="Habits">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.5h16M4 12h10M4 17.5h13"/><path d="M17.5 16.5l1.8 1.8 3-3.6"/></svg>
        <span data-i18n="nav_habits">Habits</span>
      </a>
      <a href="#/quits" data-view="quits" title="Quitting">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6.5 6.5l11 11"/></svg>
        <span data-i18n="nav_quits">Quitting</span>
      </a>
      <a href="#/stats" data-view="stats" title="Statistics">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V4"/><path d="M4 20h16"/><rect x="7.5" y="12" width="3" height="5" rx="1" fill="currentColor" stroke="none"/><rect x="12.5" y="8" width="3" height="9" rx="1" fill="currentColor" stroke="none"/><rect x="17.5" y="10" width="3" height="7" rx="1" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="nav_stats">Statistics</span>
      </a>
      <a href="#/settings" data-view="settings" title="Settings">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.2" fill="var(--surface)"/><circle cx="15" cy="12" r="2.2" fill="var(--surface)"/><circle cx="9" cy="17" r="2.2" fill="var(--surface)"/></svg>
        <span data-i18n="nav_settings">Settings</span>
      </a>
    </nav>
    <div class="sidebar-foot"><span id="app-version"></span></div>
  </aside>
  <main id="main" class="main" aria-live="polite"></main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
